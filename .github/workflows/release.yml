# Release builds (specs/RELEASE.md): a tag v* builds macOS (DMG), Windows
# (Inno Setup installer), Android (APK) and Linux (tarball, AppImage) and
# creates a DRAFT release; workflow_dispatch builds the same without a
# release (workflow artifacts only). Signing only when the secrets are
# set; every job writes its signature check into the job summary.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.v.outputs.label }}
      app_label: ${{ steps.v.outputs.app_label }}
      build_name: ${{ steps.v.outputs.build_name }}
      series: ${{ steps.v.outputs.series }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Version from the tag (v8.0.0-beta.1 → 8.0.0, series 8.0)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pubspec="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            label="$REF_NAME"
          else
            label="v${pubspec}-dev.${RUN_NUMBER}"
          fi
          if [[ ! "$label" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tag '$label' is not v<major>.<minor>.<patch>[-<suffix>]"
            exit 1
          fi
          build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          series="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          suffix="${BASH_REMATCH[5]}"
          if [[ "$series" != "${pubspec%.*}" ]]; then
            echo "::error::Series $series of the tag does not match pubspec.yaml version $pubspec"
            exit 1
          fi
          if [[ -n "$suffix" ]]; then
            prerelease=true
            title="Tryton Flutter Client ${build_name} – ${suffix}"
            [[ "$suffix" == "beta.1" ]] && title="${title} (erste Testversion)"
          else
            prerelease=false
            title="Tryton Flutter Client ${build_name}"
          fi
          {
            echo "label=$label"
            echo "app_label=${label#v}"
            echo "build_name=$build_name"
            echo "series=$series"
            echo "prerelease=$prerelease"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "Label $label, build name $build_name, series $series, prerelease $prerelease"

  macos:
    name: macOS
    needs: version
    runs-on: macos-26
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Import the Developer ID certificate (when set)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 – unsigned DMG (Gatekeeper warns)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain"
          # the temporary keychain first, the existing ones kept
          existing=()
          while IFS= read -r k; do
            k="${k//\"/}"
            existing+=("${k// /}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"
          # `  1) <SHA-1> "Developer ID Application: <name> (<team>)"`; the
          # name is masked before anything could print it and codesign
          # gets the SHA-1 hash: GitHub shows $GITHUB_ENV in the header
          # of every later step, the log is public (specs/RELEASE.md)
          line="$(security find-identity -v -p codesigning "$keychain" \
            | grep '"Developer ID Application: ' | head -1 || true)"
          name="$(sed -n 's/.*"Developer ID Application: \(.*\) ([A-Z0-9]*)"$/\1/p' <<<"$line")"
          # (not the account name of the repository, see Windows)
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          [[ -n "$name" && "$(tr '[:upper:]' '[:lower:]' <<<"$name")" != "$owner" ]] &&
            echo "::add-mask::$name"
          hash="$(sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) .*/\1/p' <<<"$line")"
          if [[ -z "$hash" ]]; then
            echo "::error::No 'Developer ID Application' identity in the certificate"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and pack the DMG
        env:
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          TRYTON_SERIES: ${{ needs.version.outputs.series }}
          APP_LABEL: ${{ needs.version.outputs.app_label }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build_macos_dmg.sh "$LABEL"
      - name: Check signature and notarization
        env:
          SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          dmg="build/dist/TrytonFlutterClient-$LABEL-macos.dmg"
          app="build/macos/Build/Products/Release/Tryton Flutter Client.app"
          # the certificate names the owner (Authority=, spctl origin=): log
          # and summary show its kind and SHA-256 fingerprint instead
          hide() { sed -E 's/^(Authority|origin)=.*/\1=(hidden, see the certificate below)/'; }
          sign="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
          dmg_check="$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 | hide || true)"
          app_check="$(spctl -a -vv "$app" 2>&1 | hide || true)"
          staple="$(xcrun stapler validate "$dmg" 2>&1 || true)"
          certs="$RUNNER_TEMP/certs"
          mkdir -p "$certs"
          certificate="(none)"
          if codesign -d --extract-certificates="$certs/cert" "$app" 2>/dev/null &&
             [[ -f "$certs/cert0" ]]; then
            kind="other certificate"
            openssl x509 -inform DER -in "$certs/cert0" -noout -subject 2>/dev/null \
              | grep -q 'CN *= *Developer ID Application:' && kind="Developer ID Application"
            certificate="$kind, SHA-256 $(shasum -a 256 "$certs/cert0" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          fi
          rm -rf "$certs"
          hide <<<"$sign"; echo "Certificate: $certificate"
          echo "$dmg_check"; echo "$app_check"; echo "$staple"
          {
            echo "### macOS: signature"
            if [[ "$SIGNED" == "true" ]]; then
              echo "Signed with the Developer ID certificate."
            else
              echo "**Not signed** (no MACOS_CERTIFICATE_P12) – Gatekeeper warns."
            fi
            echo '```'
            grep -E '^(TeamIdentifier|Timestamp|Identifier)=' <<<"$sign" || true
            echo "Certificate: $certificate"
            echo "DMG: $dmg_check"
            echo "App: $app_check"
            echo "Stapler: $staple"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SIGNED" == "true" ]] &&
             ! grep -q 'source=Notarized Developer ID' <<<"$app_check"; then
            echo "::error::The app is not 'Notarized Developer ID' although the certificate is set"
            exit 1
          fi
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/dist/TrytonFlutterClient-${{ env.LABEL }}-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-2025
    env:
      LABEL: ${{ needs.version.outputs.label }}
      # Git Bash (MSYS) would turn /options (ISCC /D…, signtool /f …) into
      # Windows paths
      MSYS_NO_PATHCONV: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build
        run: >
          flutter build windows --release
          --build-name "${{ needs.version.outputs.build_name }}"
          --build-number "${{ github.run_number }}"
          --dart-define=TRYTON_SERIES=${{ needs.version.outputs.series }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.build_name }}
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=APP_LABEL=${{ needs.version.outputs.app_label }}
      - name: Prepare signing (when set)
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$WINDOWS_CERTIFICATE_PFX" ]]; then
            echo "::warning::No WINDOWS_CERTIFICATE_PFX – unsigned installer (SmartScreen warns)."
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          # the owner's name (subject CN/O) is masked in the public log; the
          # summary shows the issuer and the SHA-256 fingerprint
          # (specs/RELEASE.md)
          pem="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.pfx" -nokeys -clcerts \
                   -passin env:WINDOWS_CERTIFICATE_PASSWORD 2>/dev/null ||
                 openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.pfx" -nokeys -clcerts \
                   -passin env:WINDOWS_CERTIFICATE_PASSWORD 2>/dev/null || true)"
          if [[ -n "$pem" ]]; then
            subject="$(openssl x509 -noout -subject -nameopt multiline <<<"$pem" 2>/dev/null || true)"
            # (not the account name of the repository: it may appear, and
            # a mask would hide it in every URL of the log)
            owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
            while IFS= read -r value; do
              [[ -n "$value" && "$(tr '[:upper:]' '[:lower:]' <<<"$value")" != "$owner" ]] &&
                echo "::add-mask::$value"
            done < <(sed -nE 's/^ *(commonName|organizationName) *= *(.*)$/\2/p' <<<"$subject")
            fingerprint="$(openssl x509 -noout -fingerprint -sha256 <<<"$pem" | sed 's/.*=//')"
            issuer="$(openssl x509 -noout -issuer -nameopt multiline <<<"$pem" \
              | sed -nE 's/^ *commonName *= *(.*)$/\1/p' | head -1)"
            echo "WINDOWS_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
            echo "WINDOWS_CERT_ISSUER=$issuer" >> "$GITHUB_ENV"
          else
            echo "::warning::The certificate could not be read with openssl – no fingerprint in the summary."
          fi
          signtool="$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
            -path '*/x64/signtool.exe' | sort -V | tail -1)"
          echo "SIGNTOOL=$signtool" >> "$GITHUB_ENV"
          echo "WINDOWS_SIGN=1" >> "$GITHUB_ENV"
      - name: Sign the application
        if: env.WINDOWS_SIGN == '1'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >
          "$SIGNTOOL" sign /f "$RUNNER_TEMP/cert.pfx" /p "$WINDOWS_CERTIFICATE_PASSWORD"
          /fd sha256 /tr http://timestamp.digicert.com /td sha256
          build/windows/x64/runner/Release/tryton_flutter_client.exe
      - name: Inno Setup (preinstalled on the runner, else Chocolatey)
        run: |
          if [[ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
            choco install innosetup --no-progress -y
          fi
      - name: Installer (Inno Setup)
        run: >
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "-DAppVersion=${{ needs.version.outputs.build_name }}"
          "-DAppLabel=$LABEL"
          installer/windows/setup.iss
      - name: Sign the installer
        if: env.WINDOWS_SIGN == '1'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >
          "$SIGNTOOL" sign /f "$RUNNER_TEMP/cert.pfx" /p "$WINDOWS_CERTIFICATE_PASSWORD"
          /fd sha256 /tr http://timestamp.digicert.com /td sha256
          "build/dist/TrytonFlutterClient-$LABEL-windows-setup.exe"
      - name: Signature in the job summary
        run: |
          setup="build/dist/TrytonFlutterClient-$LABEL-windows-setup.exe"
          {
            echo "### Windows: signature"
            if [[ "${WINDOWS_SIGN:-}" == "1" ]]; then
              echo "Application and installer signed (Authenticode)."
              echo '```'
              # without „Issued to“: the certificate names the owner
              echo "Certificate: issued by ${WINDOWS_CERT_ISSUER:-?}, SHA-256 ${WINDOWS_CERT_SHA256:-?}"
              "$SIGNTOOL" verify /pa "$setup" 2>&1 | grep -E 'Successfully verified|Number of' || true
              echo '```'
            else
              echo "**Not signed** (no WINDOWS_CERTIFICATE_PFX) – SmartScreen warns."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/dist/TrytonFlutterClient-${{ env.LABEL }}-windows-setup.exe
          if-no-files-found: error

  android:
    name: Android
    needs: version
    runs-on: ubuntu-24.04
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Upload key (when set)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE" ]]; then
            echo "::warning::No ANDROID_KEYSTORE – the APK is signed with the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        run: |
          flutter build apk --release \
            --build-name "${{ needs.version.outputs.build_name }}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=TRYTON_SERIES=${{ needs.version.outputs.series }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.build_name }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_LABEL=${{ needs.version.outputs.app_label }}
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/dist/TrytonFlutterClient-$LABEL-android.apk"
      - name: Remove the key
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
      - name: Self-test of the signature check
        run: bash test/scripts/check_apk_signature_test.sh
      - name: Check the signature (apksigner)
        env:
          UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: scripts/check_apk_signature.sh "build/dist/TrytonFlutterClient-$LABEL-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/dist/TrytonFlutterClient-${{ env.LABEL }}-android.apk
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            channel: stable
          # no official Flutter archive for Linux arm64: the SDK is cloned
          # (channel master) and checked out at FLUTTER_VERSION
          - arch: arm64
            runner: ubuntu-24.04-arm
            channel: master
    runs-on: ${{ matrix.runner }}
    # arm64 is experimental: its failure does not stop the release
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build
        run: |
          flutter build linux --release \
            --build-name "${{ needs.version.outputs.build_name }}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=TRYTON_SERIES=${{ needs.version.outputs.series }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.build_name }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_LABEL=${{ needs.version.outputs.app_label }}
      - name: Tarball and AppImage
        run: scripts/build_linux_packages.sh "$LABEL" "${{ matrix.arch }}"
      - name: Packages in the job summary
        run: |
          {
            echo "### Linux (${{ matrix.arch }})"
            echo '```'
            (cd build/dist && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/dist/TrytonFlutterClient-${{ env.LABEL }}-linux-${{ matrix.arch }}.tar.gz
            build/dist/TrytonFlutterClient-${{ env.LABEL }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, macos, windows, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Notes
        run: |
          cat > notes.md <<'NOTES'
          > **Testversion** – nur für **Tryton-Server 8.0**. iOS ist nicht enthalten.
          >
          > Unsignierte Builds: macOS (Gatekeeper) meldet „App kann nicht geöffnet werden“ – im Finder
          > Rechtsklick → „Öffnen“ bzw. Systemeinstellungen → Datenschutz & Sicherheit → „Trotzdem öffnen“.
          > Windows (SmartScreen) meldet „Der Computer wurde durch Windows geschützt“ – „Weitere
          > Informationen“ → „Trotzdem ausführen“. Android: Installation aus unbekannten Quellen erlauben.
          >
          > Linux (Tarball bzw. AppImage, x64; arm64 falls vorhanden – ungetestet): benötigt GTK 3 und
          > einen laufenden Schlüsselbund (gnome-keyring bzw. KWallet) für die gespeicherte Anmeldung.
          > Der Kamera-Scanner fehlt unter Linux; Codes per Tastatur oder Hand-Scanner eingeben.
          NOTES
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.label }}
          TITLE: ${{ needs.version.outputs.title }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --draft --title "$TITLE"
            --notes-file notes.md --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*
